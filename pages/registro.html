<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | Prime Snacks</title>
    <link rel="icon" type="image/webp" href="../img/prime-snacks.webp">
    <link rel="stylesheet" href="../styles/styles.css">
    <script src="../js/sesion.js" defer></script>
    <script src="../js/navbar.js" defer></script>
</head>
<body data-raiz="../">
    <header class="encabezado">
        <nav id="navbar" class="contenedor navbar" data-pagina="registro" aria-label="Navegación principal"></nav>
    </header>

    <main class="contenedor pagina pagina-cuenta">
        <section class="panel cuenta">
            <h1>Crear cuenta</h1>
            <p class="nota">Este formulario es de demostración. Usá datos de prueba.</p>

            <!-- Los campos no tienen name para que el navegador valide sin enviar sus valores. -->
            <form action="./registro.html#formulario-validado" method="get" autocomplete="off">
                <div class="campos-nombre">
                    <div class="campo">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" required>
                    </div>
                    <div class="campo">
                        <label for="apellido">Apellido</label>
                        <input type="text" id="apellido" required>
                    </div>
                </div>
                <div class="campo">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" required>
                </div>
                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required>
                </div>
                <div class="campo">
                    <label for="fechaNacimiento">Fecha de nacimiento</label>
                    <input type="date" id="fechaNacimiento" required>
                </div>
                <p class="formulario-validado" id="formulario-validado" tabindex="-1">
                    Datos de prueba validados. El registro de cuentas todavía es una demostración.
                </p>
                <button type="submit" class="boton boton-violeta">Registrarme</button>
            </form>

            <p class="cuenta-alternativa">¿Ya tenés cuenta? <a href="./login.html">Iniciá sesión</a></p>
        </section>
    </main>

    <footer class="pie">
        <div class="contenedor pie-contenido">
            <p><strong>Prime Snacks</strong> · Córdoba, Argentina</p>
        </div>
    </footer>
</body>
</html>
