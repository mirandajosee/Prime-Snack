<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PrimeSnacks | Registro</title>

    <link rel="stylesheet" href="../styles/styles.css">
</head>

<body>

    <main>

        <h1>Crear cuenta</h1>

        <form action="" method="post">

            <label for="nombre">Nombre:</label>

            <input
                type="text"
                id="nombre"
                name="nombre"
                required
            >

            <label for="apellido">Apellido:</label>

            <input
                type="text"
                id="apellido"
                name="apellido"
                required
            >

            <label for="email">Email:</label>

            <input
                type="email"
                id="email"
                name="email"
                required
            >

            <label for="password">Contraseña:</label>

            <input
                type="password"
                id="password"
                name="password"
                required
            >

            <label for="fechaNacimiento">
                Fecha de nacimiento:
            </label>

            <input
                type="date"
                id="fechaNacimiento"
                name="fechaNacimiento"
                required
            >

            <button type="submit">
                Registrarse
            </button>

        </form>

        <p>
            ¿Ya tenés una cuenta?
            <a href="./login.html">Iniciar sesión</a>
        </p>

        <p>
            <a href="../index.html">Volver al inicio</a>
        </p>

    </main>

</body>

</html>
