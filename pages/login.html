<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Prime Snacks</title>
    <link rel="icon" type="image/webp" href="../img/prime-snacks.webp">
    <link rel="stylesheet" href="../styles/styles.css">
    <script src="../js/navbar.js" defer></script>
    <script src="../js/login.js" defer></script>
</head>
<body data-raiz="../">
    <header class="encabezado">
        <nav id="navbar" class="contenedor navbar" data-pagina="login" aria-label="Navegación principal"></nav>
    </header>

    <main class="contenedor pagina pagina-cuenta">
        <section class="panel cuenta">
            <h1>Iniciar sesión</h1>
            <p class="nota">Este formulario es de demostración. Usá datos de prueba.</p>

            <!-- Los campos no tienen name para que el navegador valide sin enviar sus valores. -->
            <form id="formulario-login" action="../index.html" method="get" autocomplete="off">
                <div class="campo">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" required>
                </div>
                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="boton boton-violeta">Ingresar</button>
            </form>

            <p class="cuenta-alternativa">¿Todavía no tenés cuenta? <a href="./registro.html">Creá una cuenta</a></p>
        </section>
    </main>

    <footer class="pie">
        <div class="contenedor pie-contenido">
            <p><strong>Prime Snacks</strong> · Córdoba, Argentina</p>
        </div>
    </footer>
</body>
</html>
