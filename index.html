<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Prime Snacks, barritas y snacks de proteína vegetal hechos en Córdoba.">
    <title>Prime Snacks | Snacks de proteína vegetal</title>
    <link rel="icon" type="image/webp" href="./img/prime-snacks.webp">
    <link rel="stylesheet" href="./styles/styles.css">
    <script src="./js/navbar.js" defer></script>
    <script src="./js/productos.js" defer></script>
    <script src="./js/tarjetas.js" defer></script>
</head>
<body data-raiz="./">
    <header class="encabezado">
        <nav id="navbar" class="contenedor navbar" data-pagina="inicio" aria-label="Navegación principal"></nav>
    </header>

    <main class="contenedor pagina">
        <section class="portada">
            <div class="portada-texto">
                <p class="etiqueta">Snacks vegetales de Córdoba</p>
                <h1>Proteína vegetal para tu ritmo.</h1>
                <p>Barritas y snacks veganos para llevar al gimnasio, a la facu o al trabajo.</p>
                <a class="boton boton-lima" href="./pages/barritas.html">Ver barritas <span aria-hidden="true">→</span></a>
            </div>
            <img src="./img/cacao-mani.webp" alt="Barritas de cacao y maní sobre un fondo violeta"
                width="1200" height="800">
        </section>

        <section class="seccion">
            <div class="cabecera-seccion">
                <h2>Productos destacados</h2>
                <a href="./pages/snacks.html">Explorá otros snacks <span aria-hidden="true">→</span></a>
            </div>
            <p class="nota">Precios de referencia por unidad.</p>
            <div class="grilla-productos" data-catalogo="destacados"></div>
        </section>
    </main>

    <footer class="pie">
        <div class="contenedor pie-contenido">
            <p><strong>Prime Snacks</strong> · Córdoba, Argentina</p>
            <a href="./pages/registro.html">Crear una cuenta</a>
        </div>
    </footer>
</body>
</html>
